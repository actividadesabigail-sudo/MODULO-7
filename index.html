    <section class="card stack"><h3>Lista para el día</h3>${CHECKS.map((c, i) => `<label class="check"><input type="checkbox" data-a2="chk" data-i="${i}" ${S.checks[i] ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('')}</section>
    <section class="card stack"><h3>Estrategia durante el examen</h3>
      ${V.flow([{ t: 'Respira antes de empezar', s: 'Tres respiraciones lentas, como antes de un combate.' }, { t: 'Identifica el género del texto', s: '¿Narrador? ¿Versos? ¿Diálogos con acotaciones? ¿Opinión con argumentos? ¿Reseña?' }, { t: 'Lee el texto completo una vez', s: 'Fíjate en el título, el inicio y el final.' }, { t: 'Lee la pregunta y TODAS las opciones', s: 'Revisa que la figura o el concepto y su explicación coincidan.' }, { t: 'Busca la prueba en el texto', s: 'Verbos («abrí» / «abrió»), últimas palabras de los versos, primer y último párrafo.' }, { t: 'Si te atoras, pasa a la siguiente', s: 'Regresa al final. No dejes ninguna en blanco.' }])}
    </section>
    <section class="card stack"><h3>Pausa para respirar</h3><p class="muted">Úsala antes de estudiar, antes de un simulador o en el examen (en tu mente).</p><button class="btn" data-a="breath">Empezar 30 segundos</button></section>
    <button class="btn ghost wide" data-a="go" data-v="map">Ver mapa del examen: qué temas salen más</button>`;
  }
  function vMap() {
    const rows = EXAM_MAP.slice().sort((a, b) => (b[1] + b[2]) - (a[1] + a[2]));
    const totalQ = EXAM_MAP.reduce((s2, r) => s2 + r[1] + r[2], 0);
    return `<button class="back" data-a="go" data-v="exam">← Examen</button><div class="stack"><div class="eyebrow">Análisis de 2 exámenes de práctica</div><h1>Mapa del examen</h1><p class="muted">Cuántas preguntas salieron de cada tema en el simulacro versión A y en el examen en línea (${totalQ} preguntas en total). Cada punto es una pregunta.</p></div>
    <section class="card stack">
      <div class="callout trick"><p><b>Lo que más se repite:</b> el ensayo, el texto dramático, las figuras retóricas, la visión del mundo y el contexto. En el simulacro, 45 de 50 preguntas venían después de un texto. En el examen en línea aparecen preguntas para <b>completar</b> (dos espacios), <b>relacionar</b> (I-a, II-b) y <b>elegir combinación</b> (II, III y V).</p></div>
      ${rows.map(r => { const l = LMAP[r[0]]; const tot = r[1] + r[2]; return `<div class="map-row"><button class="back" style="text-align:left;color:var(--ink);font-weight:700" data-a="open" data-id="${r[0]}">${esc(l.title)}</button><span class="dots" aria-label="${tot} preguntas">${Array.from({ length: tot }, () => '<i></i>').join('') || '<span class="muted">0</span>'}</span><span class="chip ${l.prio}">${l.prio}</span></div>`; }).join('')}
      <p class="muted" style="font-size:.85rem">Prioridad alta: aparece 3 o más veces, o fallaste todas las que venían en tu simulacro (como la rima). Media: 1 o 2 veces. La estrategia de lectura no es un tema del libro, por eso tiene 0 puntos.</p>
    </section>`;
  }

  /* ═════════ VISTA: MI AVANCE ═════════ */
  const BADGES = [
    ['primer', '🌱', 'Primera misión', () => Object.keys(S.done).length >= 1],
    ['cinco', '🔥', '5 temas', () => Object.keys(S.done).length >= 5],
    ['u1', '🎯', 'Unidad 1 completa', () => LESSONS.filter(l => l.unit === 1).every(l => S.done[l.id])],
    ['u2', '📖', 'Unidad 2 completa', () => LESSONS.filter(l => l.unit === 2).every(l => S.done[l.id])],
    ['u3', '📣', 'Unidad 3 completa', () => LESSONS.filter(l => l.unit === 3).every(l => S.done[l.id])],
    ['racha3', '📅', '3 días seguidos', () => S.streak.count >= 3],
    ['racha7', '🏆', '7 días seguidos', () => S.streak.count >= 7],
    ['veloz', '⚡', 'Supervelocidad (10+)', () => S.tfBest >= 10],
    ['memoria', '🧩', '3 retos de memoria', () => Object.keys(S.games).filter(k => /^[om]\d/.test(k)).length >= 3],
    ['tarjetas', '🃏', '30 tarjetas', () => Object.keys(S.flash).length >= 30],
    ['aprobado', '✅', 'Simulacro ≥ 6', () => S.history.some(h => h.type === 'final' && h.grade >= 6)],
    ['meta7', '🎉', 'Simulacro ≥ 7', () => S.history.some(h => h.type === 'final' && h.grade >= 7)],
    ['meta8', '🚀', 'Simulacro ≥ 8', () => S.history.some(h => h.type === 'final' && h.grade >= 8)],
    ['parciales', '🧠', 'Los 3 parciales', () => [1, 2, 3].every(u => S.history.some(h => h.type === 'parcial' && h.unit === u))]
  ];
  function checkBadges() { let got = null; BADGES.forEach(b => { if (!S.badges[b[0]] && b[3]()) { S.badges[b[0]] = today(); got = b; } }); if (got) { save(); setTimeout(() => toast(`Logro desbloqueado: ${got[2]}`), 300); } }
  function shareText() {
    const done = Object.keys(S.done).length; const best = bestFinal(); const last = S.history[S.history.length - 1];
    const weak = LESSONS.filter(l => mastery(l.id) !== null && mastery(l.id) < 0.6).map(l => l.title).slice(0, 5);
    return `Avance de ${NAME} · Módulo 7\nTemas completados: ${done} de ${LESSONS.length}\nXP: ${S.xp} · Racha: ${S.streak.count} días\nMejor simulacro final: ${best ? best.grade.toFixed(1) : 'todavía no'}\nÚltimo simulador: ${last ? last.grade.toFixed(1) + ' (' + last.c + '/' + last.n + ')' : '—'}\nTemas que me cuestan: ${weak.length ? weak.join(', ') : 'ninguno por ahora'}`;
  }
  function vProgress() {
    const lv = levelOf(S.xp); const pctL = lv.to ? Math.round((S.xp - lv.from) / (lv.to - lv.from) * 100) : 100;
    const units = [1, 2, 3].map(u => { const ls = LESSONS.filter(l => l.unit === u); return [u, ls.filter(l => S.done[l.id]).length, ls.length]; });
    const txt = shareText();
    return `<button class="back" data-a="go" data-v="home">← Inicio</button><div class="stack"><div class="eyebrow">Mi avance</div><h1>Nivel ${lv.idx}: ${esc(lv.name)}</h1></div>
    <section class="card stack"><div class="spread"><b class="tnum">${S.xp} XP</b><span class="muted tnum">${lv.to ? `${lv.to - S.xp} XP para el siguiente nivel` : 'Nivel máximo'}</span></div><div class="bar"><i style="width:${pctL}%"></i></div>
      ${units.map(u => `<div class="unitbar"><div class="spread"><span>Unidad ${u[0]}</span><b class="tnum">${u[1]}/${u[2]} temas</b></div><div class="bar ok"><i style="width:${Math.round(u[1] / u[2] * 100)}%"></i></div></div>`).join('')}</section>
    <section class="card stack"><h3>Tu simulacro del ${BASELINE.date}: ${BASELINE.score}/${BASELINE.total} (${BASELINE.grade.toFixed(1)})</h3><p class="muted" style="font-size:.88rem">Aciertos por tema. Lo que está en rojo es lo que más puntos te puede dar.</p>${BASELINE.byTopic.map(b => { const p = Math.round(b[1] / b[2] * 100); return `<div class="unitbar"><div class="spread"><span style="font-size:.92rem">${esc(b[0])}</span><b class="tnum" style="font-size:.88rem;color:${p < 50 ? 'var(--bad)' : 'inherit'}">${b[1]}/${b[2]}</b></div><div class="bar ${p >= 60 ? 'ok' : ''}"><i style="width:${p}%"></i></div></div>`; }).join('')}</section>
    <section class="card stack"><h3>Logros</h3><div class="badges">${BADGES.map(b => `<div class="badge${S.badges[b[0]] ? ' got' : ''}"><span class="bi" aria-hidden="true">${b[1]}</span>${esc(b[2])}</div>`).join('')}</div></section>
    <section class="card stack"><h3>Dominio por tema</h3><p class="muted" style="font-size:.88rem">Se calcula con tus respuestas en cuestionarios y simuladores.</p>${LESSONS.map(l => { const m = mastery(l.id); return `<div class="unitbar"><div class="spread"><span style="font-size:.92rem">${esc(l.title)}</span><b class="tnum" style="font-size:.88rem">${m === null ? '—' : Math.round(m * 100) + '%'}</b></div><div class="bar ${m !== null && m >= .7 ? 'ok' : ''}"><i style="width:${m === null ? 0 : Math.round(m * 100)}%"></i></div></div>`; }).join('')}</section>
    <section class="card stack"><h3>Enviar mi avance a mi asesora (cada 15 días)</h3><pre id="shareTxt" style="white-space:pre-wrap;margin:0;font-family:inherit;font-size:.92rem;background:var(--surface-2);padding:10px;border-radius:10px">${esc(txt)}</pre>
      <div class="row"><button class="btn" data-a="copyShare">Copiar texto</button><a class="btn ghost" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Abrir WhatsApp</a></div><p class="muted" style="font-size:.85rem">Tu avance se guarda solo en este teléfono.</p></section>
    <section class="card stack"><h3>Ajustes</h3>
      <label for="rate">Velocidad de la voz: <b id="rateV" class="tnum">${S.settings.rate.toFixed(2)}</b></label><input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="${S.settings.rate}">
      <label class="check"><input type="checkbox" data-a2="setEn" ${S.settings.en ? 'checked' : ''}><span>Mostrar siempre la versión «En corto» de cada explicación</span></label>
      <label class="check"><input type="checkbox" data-a2="setAuto" ${S.settings.auto ? 'checked' : ''}><span>Leer en voz alta cada explicación al abrirla</span></label>
      <button class="btn line small" data-a="askReset">Borrar mi avance</button></section>`;
  }

  /* ═════════ MODALES ═════════ */
  function modalHTML() {
    if (UI.confirm) return `<div class="sheet-modal" role="dialog" aria-modal="true"><div class="panel"><p style="font-weight:700">${esc(UI.confirm.msg)}</p><div class="nav-btns"><button class="btn line" data-a="${UI.confirm.no}">Cancelar</button><button class="btn" data-a="${UI.confirm.yes}">Sí, continuar</button></div></div></div>`;
    if (UI.modal === 'gloss') return `<div class="sheet-modal" role="dialog" aria-modal="true" aria-label="Glosario"><div class="panel"><div class="spread"><h2>Glosario</h2><button class="icon-btn" data-a="closeModal">Cerrar</button></div><input class="search" id="glossQ" type="search" placeholder="Busca una palabra" aria-label="Buscar palabra" autocomplete="off"><div id="glossList">${glossList('')}</div></div></div>`;
    if (UI.modal === 'breath') return `<div class="sheet-modal" role="dialog" aria-modal="true" aria-label="Respiración"><div class="panel"><div class="breath"><div class="breath-c" id="breathC">Prepárate</div><p class="muted" id="breathT">Inhala 4 · sostén 4 · exhala 4</p></div><button class="btn line" data-a="closeModal">Terminar</button></div></div>`;
    return '';
  }
  let breathH = null;
  function runBreath() {
    clearInterval(breathH); let n = 0; const seq = [['Inhala', true], ['Sostén', true], ['Exhala', false]];
    const tick = () => { const c = $('#breathC'); if (!c) { clearInterval(breathH); return; } if (n >= 9) { c.textContent = '¡Listo!'; c.classList.remove('in'); clearInterval(breathH); return; } const s = seq[n % 3]; c.textContent = s[0]; c.classList.toggle('in', s[1]); n++; };
    setTimeout(tick, 600); breathH = setInterval(tick, 4000);
  }

  /* ═════════ RENDER ═════════ */
  const VIEWS = { home: vHome, route: vRoute, lesson: vLesson, quiz: vQuiz, results: vResults, practice: vPractice, review: vReview, flash: vFlash, tf: () => vTF(false), speed: () => vTF(true), order: vOrder, match: vMatch, keys: vKeys, gloss: vGloss, exam: vExam, map: vMap, progress: vProgress };
  function render(top) {
    const root = $('#app');
    root.innerHTML = `<main class="app" id="main">${(VIEWS[UI.view] || vHome)()}</main>${tabbar()}${modalHTML()}`;
    if (top) window.scrollTo({ top: 0 });
    refreshSpeak();
    if (UI.quiz && UI.view === 'quiz' && UI.quiz.limit) { const el = $('#timer'); const left = UI.quiz.limit - Math.floor((Date.now() - UI.quiz.start) / 1000); if (el) el.textContent = `${Math.floor(Math.max(0, left) / 60)}:${pad(Math.max(0, left) % 60)}`; }
  }

  /* ═════════ ACCIONES ═════════ */
  const A = {
    go(d) { stopSpeak(); if (d.v === 'order') ORD = null; if (d.v === 'match') MAT = null; if (d.v === 'tf' || d.v === 'speed') { TFS = null; clearInterval(speedH); } if (d.v === 'flash') FL = null; UI.view = d.v; render(true); },
    open(d) { openLesson(d.id); },
    openStep(d) { openLesson(d.id, Number(d.s)); },
    filter(d) { UI.routeFilter = d.f; render(); },
    speak(d) { const s = SPEAK_TXT[d.speak]; if (s) speak(s.text, d.speak, s.lang); },
    en(d) { UI.enOpen[d.k] = !UI.enOpen[d.k]; if (S.settings.en) { S.settings.en = false; save(); } render(); },
    nextStep() {
      const l = LMAP[UI.lesson]; const cards = lessonCards(l); stopSpeak();
      if (UI.step < cards.length - 1) { UI.step++; UI.hintN = 0; UI.exN = 0; }
      S.pos[l.id] = UI.step; touch();
      if (cards[UI.step].k === 'end' && !S.done[l.id]) { S.done[l.id] = today(); addXP(60); checkBadges(); }
      save(); render(true); if (S.settings.auto) setTimeout(autoRead, 250);
    },
    prevStep() { stopSpeak(); if (UI.step > 0) { UI.step--; UI.hintN = 0; UI.exN = 0; } render(true); },
    exNext() { UI.exN = (UI.exN || 0) + 1; render(); },
    hintNext() { UI.hintN = (UI.hintN || 0) + 1; render(); },
    pracAns(d) {
      const l = LMAP[UI.lesson]; const c = lessonCards(l)[UI.step]; const p = l.prac[c.i]; const k = Number(d.k);
      UI.prac[c.i] = k; const ok = k === p.a; record(l.id, ok);
      const key = `${l.id}-${c.i}`; if (ok && !S.practiced[key]) { S.practiced[key] = 1; addXP(10); } else touch();
      render();
    },
    startMini(d) { QUIZ.mini(d.t); },
    startMiniSel() { const v = $('#topicSel').value; QUIZ.mini(v); },
    startWorld(d) { QUIZ.world(Number(d.w)); },
    startParcial(d) { QUIZ.parcial(Number(d.u)); },
    startFinal() { QUIZ.final(); },
    startEva() { QUIZ.eva(); },
    startErrors() { QUIZ.errors(); },
    qAns(d) { const z = UI.quiz; if (z.mode === 'learn' && z.checked[z.i]) return; z.ans[z.i] = Number(d.k); render(); },
    qConf(d) { const z = UI.quiz; z.conf[z.i] = z.conf[z.i] === d.c ? undefined : d.c; render(); },
    qCheck() { const z = UI.quiz; z.checked[z.i] = true; const q = QMAP[z.items[z.i].id]; const ok = z.ans[z.i] === q.a; record(q.t, ok); if (ok) { addXP(5); if (S.wrong[q.id]) S.wrong[q.id] = Math.max(0, S.wrong[q.id] - 1); } else { S.wrong[q.id] = (S.wrong[q.id] || 0) + 1; touch(); } save(); render(); },
    qNext() { const z = UI.quiz; stopSpeak(); if (z.i + 1 < z.items.length) { z.i++; render(true); } else if (z.mode === 'learn') { learnFinish(); } else render(); },
    qPrev() { const z = UI.quiz; stopSpeak(); if (z.i > 0) { z.i--; render(true); } },
    qGo(d) { UI.quiz.i = Number(d.k); render(true); },
    qFinish() { finishQuiz(false); },
    qFinishForce() { UI.confirm = null; finishQuiz(true); },
    quitQuiz() { UI.confirm = { msg: '¿Salir del simulador? Perderás las respuestas de este intento.', yes: 'quitYes', no: 'closeConfirm' }; render(); },
    quitYes() { clearInterval(timerH); UI.confirm = null; UI.quiz = null; UI.view = 'practice'; stopSpeak(); render(true); },
    closeConfirm() { UI.confirm = null; render(); },
    gloss() { UI.modal = 'gloss'; render(); setTimeout(() => { const i = $('#glossQ'); if (i) i.focus(); }, 50); },
    breath() { UI.modal = 'breath'; render(); runBreath(); },
    closeModal() { UI.modal = null; clearInterval(breathH); render(); },
    flFlip() { FL.flip = !FL.flip; const el = document.querySelector('.flip'); if (el) el.classList.toggle('on', FL.flip); },
    flNext(d) { if (d.k === '1') { if (!S.flash[FL.list[FL.i]]) { S.flash[FL.list[FL.i]] = 1; addXP(2); } } else { delete S.flash[FL.list[FL.i]]; touch(); } FL.i = (FL.i + 1) % FL.list.length; FL.flip = false; checkBadges(); save(); render(); },
    tfAns(d) {
      const it = TF[TFS.list[TFS.i]]; const ok = (d.v === '1') === it[1]; if (ok) { TFS.ok++; addXP(2); } else touch();
      TFS.last = { ok, txt: (it[1] ? 'Verdadero. ' : 'Falso. ') + it[2] }; TFS.i++;
      if (TFS.speed && TFS.i >= TFS.list.length) { TFS.list = TFS.list.concat(shuffle(TF.map((_, i) => i))); }
      render();
    },
    speedGo() {
      TFS.start = Date.now(); clearInterval(speedH); render();
      speedH = setInterval(() => { const left = 60 - Math.floor((Date.now() - TFS.start) / 1000); const el = $('#spTimer'); if (el) el.textContent = left; if (left <= 0) { clearInterval(speedH); TFS.over = true; if (TFS.ok > S.tfBest) S.tfBest = TFS.ok; checkBadges(); save(); render(); } }, 250);
    },
    tfAgain() { const sp = TFS.speed; TFS = null; clearInterval(speedH); UI.view = sp ? 'speed' : 'tf'; render(true); },
    ordStart(d) { const g = ORDER_GAMES.find(x => x.id === d.id); let cur = shuffle(g.items); while (cur.every((x, i) => x === g.items[i])) cur = shuffle(g.items); ORD = { id: d.id, cur, checked: false }; render(true); },
    ordBack() { ORD = null; render(true); },
    ordMv(d) { const k = Number(d.k), dd = Number(d.d), j = k + dd; if (j < 0 || j >= ORD.cur.length) return; [ORD.cur[k], ORD.cur[j]] = [ORD.cur[j], ORD.cur[k]]; ORD.checked = false; render(); },
    ordCheck() { ORD.checked = true; const g = ORDER_GAMES.find(x => x.id === ORD.id); if (ORD.cur.every((x, i) => x === g.items[i]) && !S.games[g.id]) { S.games[g.id] = 1; addXP(20); checkBadges(); } else touch(); save(); render(); },
    matStart(d) { const g = MATCH_GAMES.find(x => x.id === d.id); const idx = g.pairs.map((_, i) => i); MAT = { id: d.id, L: shuffle(idx), R: shuffle(idx), done: {}, selL: null, err: null }; render(true); },
    matBack() { MAT = null; render(true); },
    matL(d) { MAT.selL = Number(d.i); MAT.err = null; render(); },
    matR(d) {
      const i = Number(d.i); if (MAT.selL === null) { toast('Primero toca un concepto de la izquierda.'); return; }
      if (i === MAT.selL) { MAT.done[i] = 1; MAT.selL = null; MAT.err = null; const g = MATCH_GAMES.find(x => x.id === MAT.id); if (Object.keys(MAT.done).length === g.pairs.length && !S.games[g.id]) { S.games[g.id] = 1; addXP(20); checkBadges(); } touch(); }
      else { MAT.err = i; }
      render();
    },
    copyShare() { const t = shareText(); if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Copiado. Pégalo en WhatsApp.'), () => selectShare()); else selectShare(); },
    askReset() { UI.confirm = { msg: '¿Borrar todo tu avance en este teléfono? No se puede deshacer.', yes: 'doReset', no: 'closeConfirm' }; render(); },
    doReset() { S = defaults(); S.planStart = today(); save(); PLAN = buildPlan(); UI.confirm = null; UI.view = 'home'; render(true); toast('Avance borrado.'); },
    replan() { S.planStart = today(); save(); PLAN = buildPlan(); render(); toast('Listo: tu plan empieza hoy.'); }
  };
  function selectShare() { const el = $('#shareTxt'); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto seleccionado: cópialo.'); }
  function learnFinish() {
    const z = UI.quiz; let c = 0; const topics = {}; const review = [];
    z.items.forEach((it, k) => { const q = QMAP[it.id]; const ok = z.ans[k] === q.a; if (ok) c++; topics[q.t] = topics[q.t] || [0, 0]; topics[q.t][1]++; if (ok) topics[q.t][0]++; review.push({ k, id: q.id, ok, sel: z.ans[k], order: it.order }); });
    UI.review = { type: z.type, title: z.title, date: today(), c, n: z.items.length, grade: grade10(c, z.items.length), units: { 1: [0, 0], 2: [0, 0], 3: [0, 0] }, topics, sureWrong: [], review };
    if (z.topic) S.games['mini-' + z.topic] = 1;
    UI.quiz = null; UI.view = 'results'; checkBadges(); save(); render(true);
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    if (el.classList.contains('sheet-modal')) return;
    const fn = A[el.dataset.a]; if (fn) { e.preventDefault(); fn(el.dataset, el); }
  });
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.flip')) { e.preventDefault(); A.flFlip(); } if (e.key === 'Escape' && (UI.modal || UI.confirm)) { UI.modal = null; UI.confirm = null; render(); } });
  document.addEventListener('input', e => {
    if (e.target.id === 'glossQ') { const l = $('#glossList'); if (l) l.innerHTML = glossList(e.target.value); }
    if (e.target.id === 'rate') { S.settings.rate = Number(e.target.value); const v = $('#rateV'); if (v) v.textContent = S.settings.rate.toFixed(2); save(); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'flTopic') { initFlash(t.value); render(); }
    if (t.dataset.a2 === 'chk') { S.checks[t.dataset.i] = t.checked; save(); }
    if (t.dataset.a2 === 'setEn') { S.settings.en = t.checked; save(); }
    if (t.dataset.a2 === 'setAuto') { S.settings.auto = t.checked; save(); }
    if (t.dataset.a2 === 'exam') { const d = $('#exDate').value, tm = $('#exTime').value, sd = $('#exSede').value; const prev = examInfo(); S.exam = { date: /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : prev.date, time: tm || '', sede: sd.trim(), set: true }; save(); PLAN = buildPlan(); render(); toast('Guardado. Tu plan se ajustó a la nueva fecha.'); }
  });

  PLAN = buildPlan();
  checkBadges();
  render();
  /* Para pruebas automáticas */
  window.__M7 = { buildPlan: () => buildPlan(), QUIZ, S: () => S };
})();
</script>
</script>
</body></html>
