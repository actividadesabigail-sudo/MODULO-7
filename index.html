<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Misión Módulo 7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plataforma de estudio del Módulo 7 de Prepa Abierta (Textos y visiones del mundo) para Josmar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<style>/* Concepto: "Cuaderno de misiones" — app de bolsillo; cada tema es una hoja con margen y resaltador;
   las opciones de respuesta son los óvalos de la hoja de respuestas. Color azul: el favorito de Josmar. */
:root {
  --bg: #f1f5fb;
  --surface: #ffffff;
  --surface-2: #e7eef9;
  --ink: #14202f;
  --muted: #586579;
  --line: #d9e2ef;
  --accent: #1d5fd0;
  --accent-2: #4a86e8;
  --accent-soft: #e1ecff;
  --on-accent: #ffffff;
  --mark: #ffe27a;
  --mark-ink: #14202f;
  --ok: #17845a;
  --ok-soft: #dff5ea;
  --bad: #c2403a;
  --bad-soft: #fde6e4;
  --warn: #a5650a;
  --warn-soft: #fff0d6;
  --margin-rule: #f0b9c8;
  --shadow: 0 1px 2px rgba(15, 35, 75, .06), 0 6px 18px rgba(15, 35, 75, .06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1420; --surface: #172030; --surface-2: #202b3e; --ink: #e8eef8; --muted: #9aa8bd; --line: #2b3850;
    --accent: #7fb0ff; --accent-2: #a9c9ff; --accent-soft: #1d2f4f; --on-accent: #0a1426;
    --mark: #6b5a17; --mark-ink: #fff6d2; --ok: #5fd39f; --ok-soft: #173627; --bad: #ff8a80; --bad-soft: #3d1f1d;
    --warn: #ffc56b; --warn-soft: #3a2b12; --margin-rule: #5a3442; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1420; --surface: #172030; --surface-2: #202b3e; --ink: #e8eef8; --muted: #9aa8bd; --line: #2b3850;
  --accent: #7fb0ff; --accent-2: #a9c9ff; --accent-soft: #1d2f4f; --on-accent: #0a1426;
  --mark: #6b5a17; --mark-ink: #fff6d2; --ok: #5fd39f; --ok-soft: #173627; --bad: #ff8a80; --bad-soft: #3d1f1d;
  --warn: #ffc56b; --warn-soft: #3a2b12; --margin-rule: #5a3442; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
mark { background: linear-gradient(transparent 38%, var(--mark) 38%, var(--mark) 92%, transparent 92%); color: var(--mark-ink); padding: 0 2px; }
.app {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 16px;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 750; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
small, .muted { color: var(--muted); }
.eyebrow { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.tnum { font-variant-numeric: tabular-nums; }

/* Botones */
.btn {
  border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 700; font-size: .98rem;
  background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
  text-decoration: none; justify-content: center;
}
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.line { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 7px 13px; min-height: 36px; font-size: .88rem; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; font-weight: 700; min-height: 36px; display: inline-flex; gap: 6px; align-items: center; color: var(--ink); }
.icon-btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Chips de prioridad */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.alta { background: var(--bad-soft); color: var(--bad); }
.chip.media { background: var(--warn-soft); color: var(--warn); }
.chip.baja { background: var(--surface-2); color: var(--muted); }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.fmt { background: var(--accent-soft); color: var(--accent); }

/* Barra de progreso */
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.bar.ok > i { background: var(--ok); }

/* Inicio */
.hero { background: var(--accent); color: var(--on-accent); border-radius: 20px; padding: 18px; display: grid; gap: 12px; position: relative; overflow: hidden; }
.hero h1 { color: var(--on-accent); }
.hero .sub { opacity: .88; }
.count { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.count b { font-family: var(--font-display); font-size: 3.4rem; line-height: .9; font-weight: 800; }
.hero .bar { background: rgba(255,255,255,.25); }
.hero .bar > i { background: var(--on-accent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow); display: grid; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; }
.stat span { font-size: .8rem; color: var(--muted); }
.mission { border-left: 5px solid var(--accent); }
.mission-l { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 0; width: 100%; text-align: left; }
.mission-l .t { flex: 1; min-width: 0; font-weight: 700; }
.mission-l.done { opacity: .6; }
.motiv { font-family: var(--font-display); font-size: 1.05rem; font-weight: 650; }
.compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; }
.compare b { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; display: block; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.badge { border-radius: 12px; padding: 10px 6px; text-align: center; background: var(--surface-2); font-size: .75rem; font-weight: 700; display: grid; gap: 4px; }
.badge .bi { font-size: 1.6rem; filter: grayscale(1); opacity: .35; }
.badge.got { background: var(--accent-soft); color: var(--accent); }
.badge.got .bi { filter: none; opacity: 1; }

/* Ruta */
.world { display: grid; gap: 8px; }
.world-h { display: flex; gap: 10px; align-items: center; }
.world-h .wi { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; font-size: 1.25rem; flex: none; }
.lrow { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); text-align: left; width: 100%; }
.lrow .n { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: .85rem; color: var(--muted); }
.lrow.done .n { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.lrow.started .n { border-color: var(--accent); color: var(--accent); }
.lrow .tt { font-weight: 700; line-height: 1.25; }
.lrow .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; font-size: .8rem; color: var(--muted); }
.mini-bar { width: 54px; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }

/* Lección: hoja de cuaderno */
.lesson-top { display: grid; gap: 10px; }
.steps-dots { display: flex; gap: 4px; }
.steps-dots i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); }
.steps-dots i.on { background: var(--accent); }
.steps-dots i.cur { background: var(--accent-2); }
.sheet { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 16px 18px 26px; position: relative; display: grid; gap: 12px; min-width: 0; }
.sheet::before { content: ""; position: absolute; left: 12px; top: 14px; bottom: 14px; width: 2px; background: var(--margin-rule); border-radius: 2px; }
.sheet h2 { color: var(--accent); }
.sheet .body { font-size: 1.06rem; line-height: 1.65; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.en-box { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .95rem; display: grid; gap: 6px; }
.en-box .lab { font-size: .72rem; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
.nav-btns { display: flex; gap: 10px; justify-content: space-between; }
.nav-btns .btn { flex: 1; }
.callout { border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.callout.trap { background: var(--bad-soft); }
.callout.trap h3 { color: var(--bad); }
.callout.trick { background: var(--accent-soft); }
.callout.trick h3 { color: var(--accent); }
.callout ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.solved ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.solved li.hide { display: none; }
.answer-box { background: var(--ok-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-weight: 700; }

/* Visuales */
.vis { margin-top: 4px; min-width: 0; }
.pyr { display: grid; gap: 4px; justify-items: center; }
.pyr-row { background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 7px 10px; text-align: center; display: grid; font-size: .9rem; line-height: 1.25; }
.pyr-row:nth-child(2) { background: var(--accent-2); }
.pyr-row:nth-child(3) { background: color-mix(in srgb, var(--accent) 70%, var(--surface)); }
.pyr-row:nth-child(4) { background: color-mix(in srgb, var(--accent) 55%, var(--surface)); color: var(--ink); }
.pyr-row:nth-child(5) { background: color-mix(in srgb, var(--accent) 35%, var(--surface)); color: var(--ink); }
.pyr-row span { font-size: .78rem; opacity: .9; }
.pyr-note { font-size: .78rem; color: var(--muted); }
.line-wrap { overflow-x: auto; padding-bottom: 6px; }
.line { display: flex; gap: 0; min-width: max-content; position: relative; padding-top: 6px; }
.line-item { width: 132px; display: grid; gap: 4px; justify-items: center; text-align: center; position: relative; padding: 0 6px; }
.line-item::before { content: ""; position: absolute; top: 37px; left: 0; right: 0; height: 3px; background: var(--line); z-index: 0; }
.line-age { font-size: .74rem; font-weight: 800; color: var(--accent); min-height: 2.2em; display: grid; align-items: end; }
.line-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: .85rem; z-index: 1; }
.line-t { font-weight: 700; font-size: .86rem; line-height: 1.2; }
.line-s { font-size: .76rem; color: var(--muted); line-height: 1.25; }
.flow { display: grid; gap: 4px; }
.flow-step { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
.flow-step b { display: block; line-height: 1.25; }
.flow-step small { display: block; line-height: 1.35; margin-top: 2px; }
.flow-n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.flow-arrow { text-align: center; color: var(--muted); line-height: 1; font-size: .9rem; }
.flow-back { font-size: .85rem; font-weight: 700; color: var(--accent); text-align: center; padding-top: 4px; }
.tbl-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
.tbl { border-collapse: collapse; width: 100%; font-size: .9rem; min-width: 420px; }
.tbl th { background: var(--accent-soft); color: var(--accent); text-align: left; padding: 8px 10px; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
.tbl td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; line-height: 1.4; }
.tree { display: grid; gap: 10px; justify-items: center; }
.tree-root { background: var(--accent); color: var(--on-accent); padding: 8px 18px; border-radius: 10px; font-weight: 800; font-family: var(--font-display); }
.tree-kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; width: 100%; }
.tree-kid { border: 2px solid var(--accent); border-radius: 10px; padding: 8px; text-align: center; display: grid; }
.tree-kid small { display: block; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.vs-col { background: var(--surface-2); border-radius: 10px; padding: 10px; min-width: 0; }
.vs-h { font-weight: 800; font-size: .82rem; letter-spacing: .03em; color: var(--accent); margin-bottom: 6px; }
.vs-col ul { margin: 0; padding-left: 16px; display: grid; gap: 4px; font-size: .9rem; line-height: 1.35; }
.vs-mid { align-self: center; font-weight: 800; color: var(--muted); font-size: .8rem; }
@media (max-width: 460px) { .vs { grid-template-columns: 1fr; } .vs-mid { justify-self: center; } }
.pairs { display: grid; gap: 6px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; background: var(--surface-2); border-radius: 10px; padding: 9px 11px; font-size: .92rem; line-height: 1.4; }
@media (max-width: 460px) { .pair { grid-template-columns: 1fr; gap: 2px; } }
.doc { border: 1.5px dashed var(--line); border-radius: 10px; overflow: hidden; }
.doc-h { background: var(--surface-2); padding: 6px 10px; font-size: .78rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.doc-b { padding: 10px 12px; font-size: .95rem; }

/* Preguntas: óvalos de la hoja de respuestas */
.q { display: grid; gap: 12px; }
.q-text { font-size: 1.08rem; font-weight: 600; line-height: 1.5; }
.passage { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: .98rem; line-height: 1.6; }
.passage h3 { font-size: .98rem; margin-bottom: 6px; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; min-height: 52px; width: 100%; line-height: 1.35; }
.opt .ov { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 800; font-size: .85rem; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .ov { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .ov { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .ov { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.opt[disabled] { cursor: default; }
.fb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.fb.ok { background: var(--ok-soft); }
.fb.no { background: var(--bad-soft); }
.fb b.h { font-family: var(--font-display); font-size: 1.05rem; }
.fb.ok b.h { color: var(--ok); }
.fb.no b.h { color: var(--bad); }
.hint { background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.hint ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.conf { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.conf button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: .82rem; font-weight: 700; }
.conf button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.qnav { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; }
.qnav button { height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-size: .78rem; font-weight: 700; }
.qnav button.ans { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.qnav button.cur { outline: 2px solid var(--ink); }
.timer { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* Resultados */
.grade { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 8px 0; }

.grade > b { font-family: var(--font-display); font-size: 4rem; line-height: 1; font-weight: 800; color: var(--accent); }
.unitbars { display: grid; gap: 10px; }
.unitbar { display: grid; gap: 4px; }
.review-item { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; font-size: .95rem; }
.review-item .yo { color: var(--bad); }
.review-item .ok { color: var(--ok); font-weight: 700; }
.histo { display: flex; gap: 6px; align-items: flex-end; height: 120px; padding-top: 6px; }
.histo .col { flex: 1; display: grid; gap: 4px; justify-items: center; align-content: end; height: 100%; min-width: 0; }
.histo .col i { width: 100%; max-width: 34px; background: var(--accent); border-radius: 6px 6px 2px 2px; display: block; }
.histo .col.base i { background: var(--muted); }
.histo .col span { font-size: .7rem; color: var(--muted); }
.histo .col b { font-size: .78rem; }

/* Repaso */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 0; text-align: left; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 6px; min-height: 104px; align-content: start; }
.tile .ti { font-size: 1.5rem; }
.tile b { font-family: var(--font-display); font-size: 1.02rem; }
.tile span { font-size: .84rem; color: var(--muted); line-height: 1.35; }
.flip { perspective: 1000px; }
.flip-in { position: relative; min-height: 220px; transition: transform .5s; transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; padding: 22px; display: grid; place-items: center; text-align: center; font-size: 1.2rem; font-weight: 700; line-height: 1.4; box-shadow: var(--shadow); }
.face.front { background: var(--surface); }
.face.back { background: var(--accent); color: var(--on-accent); transform: rotateY(180deg); font-size: 1.05rem; }
.face small { display: block; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-bottom: 6px; }
.tf-card { text-align: center; font-size: 1.18rem; font-weight: 700; padding: 28px 18px; }
.tf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.order-list { display: grid; gap: 8px; }
.order-item { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.order-item .on { font-weight: 800; color: var(--accent); text-align: center; }
.order-item .mv { display: flex; gap: 4px; }

<div id="app"><p style="padding:24px">Cargando tu plataforma…</p></div>
<noscript><p style="padding:24px">Activa JavaScript para usar la plataforma.</p></noscript>
<script>const V = {
  // Pirámide: niveles de ABAJO hacia ARRIBA
  pyr(levels) {
    const n = levels.length;
    const rows = levels.slice().reverse().map((l, i) => {
      const w = 38 + (i * (62 / Math.max(1, n - 1)));
      return `<div class="pyr-row" style="width:${w}%"><b>${l.t}</b>${l.s ? `<span>${l.s}</span>` : ''}</div>`;
    }).join('');
    return `<div class="vis pyr">${rows}<div class="pyr-note">⬆ Se sube de abajo hacia arriba</div></div>`;
  },
  // Línea del tiempo horizontal
  line(items) {
    return `<div class="vis line-wrap"><div class="line">${items.map((it, i) =>
      `<div class="line-item"><div class="line-age">${it.a}</div><div class="line-dot">${i + 1}</div><div class="line-t">${it.t}</div>${it.s ? `<div class="line-s">${it.s}</div>` : ''}</div>`).join('')}</div></div>`;
  },
  // Secuencia de pasos (cycle = proceso que se repite)
  flow(items, cycle) {
    return `<div class="vis flow${cycle ? ' cycle' : ''}">${items.map((it, i) =>
      `<div class="flow-step"><span class="flow-n">${i + 1}</span><div><b>${it.t}</b>${it.s ? `<small>${it.s}</small>` : ''}</div></div>`).join('<div class="flow-arrow" aria-hidden="true">↓</div>')}${cycle ? '<div class="flow-back">↺ Puedes regresar a cualquier paso: el proceso se repite</div>' : ''}</div>`;
  },
  // Tabla
  tbl(head, rows) {
    return `<div class="vis tbl-wrap"><table class="tbl"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  },
  // Árbol / mapa conceptual simple
  tree(root, kids) {
    return `<div class="vis tree"><div class="tree-root">${root}</div><div class="tree-kids">${kids.map(k =>
      `<div class="tree-kid"><b>${k.t}</b>${k.s ? `<small>${k.s}</small>` : ''}</div>`).join('')}</div></div>`;
  },
  // Dos columnas que se comparan
  vs(a, b) {
    const col = c => `<div class="vs-col"><div class="vs-h">${c.t}</div><ul>${c.items.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
    return `<div class="vis vs">${col(a)}<div class="vs-mid">vs</div>${col(b)}</div>`;
  },
  // Tarjetas término → significado
  pairs(list) {
    return `<div class="vis pairs">${list.map(p => `<div class="pair"><b>${p[0]}</b><span>${p[1]}</span></div>`).join('')}</div>`;
  },
  // Caja de ejemplo (texto modelo)
  doc(title, html) {
    return `<div class="vis doc"><div class="doc-h">${title}</div><div class="doc-b">${html}</div></div>`;
  }
};

/* MUNDOS · Módulo 7 · Textos y visiones del mundo */
const WORLDS = [
  { id: 1, unit: 1, name: 'El texto literario y sus géneros', icon: '📚' },
  { id: 2, unit: 1, name: 'Narrar historias', icon: '🥋' },
  { id: 3, unit: 1, name: 'La poesía por dentro', icon: '🎵' },
  { id: 4, unit: 1, name: 'Teatro y ensayo', icon: '🎭' },
  { id: 5, unit: 2, name: 'Texto, contexto y visión del mundo', icon: '🌎' },

const LESSONS = [];

/* ───────── L1 · TEXTO LITERARIO ───────── */
LESSONS.push({
  id: 'literario', world: 1, unit: 1, title: 'El texto literario y su lenguaje', prio: 'alta', mins: 20,
  freq: 'Salió en 3 preguntas de los 2 exámenes de práctica. En tu simulacro fallaste 2 de ellas (6 y 28).',
  goal: 'Distinguir un texto literario de uno no literario y reconocer el tipo de lenguaje.',
  en: 'Literario = lenguaje connotativo (figurado), intención estética, función poética. No literario = lenguaje denotativo, fin práctico (informar, instruir).',
  steps: [
    { h: 'Imagina que…', t: 'Imagina dos mensajes sobre la lluvia. Uno dice: «Mañana lloverá 20 mm en la CDMX». Otro dice: «Mañana el cielo va a llorar sobre la ciudad». El primero <b>informa</b>: sirve para algo práctico. El segundo quiere que <b>sientas</b> e imagines: busca belleza. Ese segundo es <mark>lenguaje literario</mark>.',
      en: 'Informar con datos exactos = no literario. Hacer sentir e imaginar = literario.' },
    { h: 'Vamos paso por paso: denotativo vs. connotativo', t: 'Piénsalo como en matemáticas: un texto <b>denotativo</b> es como una ecuación con <b>una sola solución</b>: cada palabra significa exactamente lo que dice el diccionario. Un texto <b>connotativo</b> admite <b>varias interpretaciones</b>: las palabras sugieren más de lo que dicen.',
      en: 'Denotativo = un significado, el del diccionario. Connotativo = varios significados, sugiere.',
      v: () => V.vs({ t: 'Texto NO literario', items: ['Lenguaje <b>denotativo</b> (directo)', 'Fin <b>práctico</b>: informar, explicar, instruir', 'Datos verificables', 'Ej.: noticia, receta, instructivo, artículo científico'] }, { t: 'Texto LITERARIO', items: ['Lenguaje <b>connotativo</b> (figurado)', 'Fin <b>estético</b>: crear belleza, emocionar', '<b>Ficción</b>: crea mundos imaginarios', 'Ej.: cuento, novela, poema, obra de teatro, ensayo literario'] }) },
    { h: 'Observa con atención: los rasgos del texto literario', t: 'El libro del módulo menciona estos rasgos. Si una opción del examen los menciona, casi seguro es la correcta:',
      en: 'Rasgos: connotativo, artificial (trabajado), función poética, intención estética, ficción.',
      v: () => V.pairs([
        ['Lenguaje connotativo', 'Puede adquirir distintos significados; está abierto a la interpretación del lector.'],
        ['Artificialidad', 'El autor «modela» el lenguaje como un escultor modela el barro: lo trabaja con recursos retóricos.'],
        ['Función poética', 'De las funciones del lenguaje, en la literatura predomina la poética: importa <i>cómo</i> se dice.'],
        ['Intención estética', 'Su finalidad no es práctica sino artística: busca la belleza.'],
        ['Ficción', 'El lector imagina y reconstruye mundos que no existen tal cual.']]) },
    { h: 'Tipos de lenguaje que te pueden preguntar', t: 'En el examen en línea te dieron un fragmento y te preguntaron qué lenguaje usa. Hay cuatro opciones típicas:',
      en: 'Coloquial = plática informal. Formal = cuidado, serio. Técnico = de una profesión. Literario = figurado y estético.',
      v: () => V.tbl(['Lenguaje', 'Cómo lo reconoces', 'Ejemplo'], [
        ['<b>Coloquial</b>', 'Plática informal, de todos los días', '«¿Qué onda, ya llegaste?»'],
        ['<b>Formal</b>', 'Cuidado y serio, sin adornos', '«Le informamos que su trámite fue aprobado.»'],
        ['<b>Técnico</b>', 'Palabras de una ciencia o profesión', '«El algoritmo recorre el arreglo en tiempo lineal.»'],
        ['<b>Literario</b>', 'Figurado, emotivo, con imágenes y exclamaciones', '«He buscado la virtud en la soledad de los campos.»']]) },
    { h: 'Este error suele aparecer en los exámenes', t: 'Un fragmento literario puede sonar <b>formal</b> porque es antiguo o elegante. Pero si habla de emociones, usa imágenes («el silencio de la noche»), exclamaciones o reflexiones íntimas, la respuesta es <mark>literario</mark>. Pregúntate: ¿quiere informarme o hacerme sentir?',
      en: 'Si suena elegante PERO busca emocionar con imágenes, es literario, no formal.' }
  ],
  trap: [
    '<b>«Denotativo»</b> o «solo informa» en una opción = NO es literario.',
    'Un texto antiguo y elegante no es «formal»: si busca emocionar, es <b>literario</b>.',
    'La intención de un texto literario es <b>estética</b> (belleza) y <b>emotiva</b>, no práctica.'
  ],
  trick: '<b>Denotativo = Diccionario</b> (las dos empiezan con D). <b>Connotativo = Con otros significados</b>.',
  ex: { q: '«Mañana el cielo va a llorar sobre la ciudad». ¿Qué tipo de lenguaje predomina?', pasos: ['¿El cielo llora de verdad? No: «llorar» significa aquí «llover».', 'Si una palabra significa algo distinto a su sentido de diccionario, es lenguaje figurado.', 'Lenguaje figurado y con intención de emocionar = connotativo (literario).'], a: 'Connotativo o literario' },
  prac: [
    { lvl: 'g', q: '¿Qué característica distingue a un texto literario?', o: ['Usa lenguaje denotativo para informar con exactitud', 'Usa lenguaje connotativo y busca un efecto estético', 'Presenta solo datos comprobables', 'Da instrucciones paso a paso'], a: 1,
      pasos: ['Recuerda: Denotativo = Diccionario = no literario.', 'Literario = connotativo, artificial, función poética.', 'Busca la opción que diga «connotativo» y «estético».'],
      why: 'El texto literario usa un lenguaje connotativo, trabajado (artificial) y con intención estética.',
      oe: ['Eso describe un texto no literario (informativo).', '¡Correcto!', 'Los datos comprobables son de textos informativos o científicos.', 'Dar instrucciones es propio del instructivo.'] },
    { lvl: 's', q: 'Lee: «¡La virtud! Pero la virtud es para mí como la providencia: un poder misterioso que concibo pero que no conozco». ¿Qué tipo de lenguaje se usa?', o: ['Coloquial', 'Técnico', 'Literario', 'Formal'], a: 2,
      pista: 'Fíjate en la exclamación y en la comparación con «como». ¿Quiere informarte o hacerte reflexionar y sentir?',
      why: 'Hay exclamación, comparación y reflexión íntima: es lenguaje literario.',
      oe: ['No es una plática informal.', 'No usa términos de una ciencia o profesión.', '¡Correcto!', 'Suena elegante, pero su intención es estética y emotiva: literario.'] },
    { lvl: 'i', q: '¿Qué función del lenguaje predomina en los textos literarios?', o: ['Fática', 'Poética', 'Apelativa', 'Metalingüística'], a: 1,
      why: 'En la literatura predomina la función poética: lo importante es la forma de decir las cosas.',
      oe: ['La fática solo mantiene abierto el canal («¿bueno?, ¿me escuchas?»).', '¡Correcto!', 'La apelativa busca que el receptor haga algo.', 'La metalingüística habla del propio lenguaje.'] }
  ]
});

/* ───────── L2 · GÉNEROS Y MODALIDADES ───────── */
LESSONS.push({

    { h: 'Vamos paso por paso: los 4 géneros', t: 'Según el criterio estructural del libro hay cuatro géneros. Cada uno tiene una «huella digital»:',

        ['<b>Narrativo</b>', 'Cuenta hechos en prosa: cuento, novela, leyenda', 'Un <b>narrador</b>'],
        ['<b>Lírico</b>', 'Versos y estrofas que expresan sentimientos', 'El <b>hablante lírico</b> (yo poético)'],
        ['<b>Dramático</b>', '<b>Diálogos</b> y <b>acotaciones</b>; se escribe para representarse', 'Los <b>personajes</b> (no hay narrador)'],
        ['<b>Ensayístico</b>', 'Opinión razonada: hipótesis, argumentos y conclusión', 'La <b>voz del autor</b>']]) },

        ['Exposición', 'Explica e informa un tema para que se comprenda.'],

/* ───────── L4 · NARRADOR ───────── */

/* LEER UN TEXTO DEL EXAMEN */
Q('leer-examen', '¿Qué debes hacer primero al encontrar un texto en el examen?', ['Contestar la última pregunta', 'Identificar qué tipo de texto es (su género)', 'Contar las palabras', 'Saltarte el texto y leer solo las opciones'], 1, 'Saber el género te dice qué buscar: narrador, versos, acotaciones o hipótesis.');
Q('leer-examen', 'En un poema te preguntan por el tipo de rima. ¿Dónde buscas?', ['En el título', 'En las últimas palabras de los versos', 'En la primera palabra de cada verso', 'En el nombre del autor'], 1, 'La rima está en la terminación de los versos.');
Q('leer-examen', 'La respuesta correcta a una pregunta sobre un texto:', ['Depende de tu opinión personal', 'Siempre se puede demostrar con algo del texto', 'Es siempre la opción más larga', 'Es siempre la opción C'], 1, 'Busca la prueba en el texto: así eliges con seguridad.');
Q('leer-examen', 'Para elegir el título que mejor identifica un relato, conviene buscar:', ['La palabra más rara', 'El objeto o la idea que une toda la historia', 'El nombre del lugar', 'El primer sustantivo que aparece'], 1, 'El mejor título nombra lo que une el inicio, el conflicto y el final.');
Q('leer-examen', 'En el examen, si una pregunta de un texto te parece muy difícil, lo mejor es:', ['Dejarla en blanco para siempre', 'Pasar a la siguiente y regresar después', 'Cambiar todas tus respuestas anteriores', 'Elegir al azar sin leer'], 1, 'Avanza y regresa; no dejes ninguna en blanco al final.');
Q('leer-examen', 'En un ensayo, ¿dónde suele estar la conclusión?', ['En el primer párrafo', 'En el último párrafo, después de «en suma» o «en conclusión»', 'En el título', 'En las acotaciones'], 1, 'La conclusión cierra el texto retomando la idea central.');

/* NARRADOR */
Q('narrador', '«Lancé la patada y sentí que el mundo se detenía». ¿Qué tipo de narrador es?', ['Testigo', 'Omnisciente', 'Protagonista', 'Equisciente'], 2, 'Primera persona y cuenta lo que él mismo vive: protagonista.');
Q('narrador', '«Ana sonreía, pero por dentro sentía miedo; su hermano, en cambio, pensaba solo en el dinero». ¿Qué narrador es?', ['Omnisciente', 'Testigo', 'Protagonista', 'En segunda persona'], 0, 'Tercera persona y conoce lo que sienten y piensan varios personajes: omnisciente.');
Q('narrador', '«Abres los ojos y no reconoces el cuarto. Te levantas despacio». ¿Qué narrador es?', ['Protagonista', 'Testigo', 'Omnisciente', 'En segunda persona'], 3, 'Se dirige a un «tú»: narrador en segunda persona.');
Q('narrador', 'Según el libro, el narrador testigo:', ['Es el personaje principal y habla en primera persona', 'Refiere los acontecimientos que ha presenciado; suele ser un personaje menor y generalmente se expresa en tercera persona', 'Lo sabe todo, como un dios', 'Siempre se dirige a un «tú»'], 1, 'El testigo cuenta lo que presenció y solo lo que sabe.');
Q('narrador', 'El narrador que cuenta lo que le sucede a otro personaje, porque lo presenció, es:', ['Testigo', 'Protagonista', 'Omnisciente', 'Hablante lírico'], 0, 'El testigo cuenta lo que vio, no lo que vivió él mismo.');
Q('narrador', '«Llegó al taller con el reloj entre las manos. El relojero dudó toda la noche si debía repararlo». Este narrador:', ['Es protagonista porque habla en primera persona', 'Es testigo porque no conoce pensamientos', 'Es omnisciente: narra en tercera persona y conoce las dudas del personaje', 'Está en segunda persona'], 2, 'Tercera persona + conoce las dudas = omnisciente.');
Q('narrador', 'El narrador de un relato es:', ['Siempre el autor del libro', 'La voz que cuenta la historia, creada por el autor', 'El lector', 'El personaje antagonista'], 1, 'El narrador es una voz inventada por el autor; no es el autor.');

/* ESTRUCTURA */
Q('estructura', 'En la estructura narrativa, ¿qué parte presenta a los personajes, el lugar y el tiempo, cuando todo está en calma?', ['Clímax', 'Desenlace', 'Situación inicial', 'Desarrollo'], 2, 'La situación inicial presenta y no tiene conflicto aún.');
Q('estructura', 'Según el libro, el momento en que a los personajes se les presenta una dificultad o suceso extraordinario se llama:', ['Desenlace', 'Suceso desencadenante o desarrollo', 'Clímax', 'Ambiente'], 1, 'El suceso desencadenante (también llamado desarrollo, conflicto o problema).');
Q('estructura', 'Ordena la estructura del texto narrativo: I. Clímax o reacción · II. Situación inicial · III. Desenlace o situación final · IV. Suceso desencadenante', ['II, IV, I y III', 'IV, II, III y I', 'II, I, IV y III', 'IV, I, II y III'], 0, 'Inicio (situación inicial), desarrollo (suceso desencadenante), clímax (reacción) y desenlace (situación final).', { f: 'ordenar' });
Q('estructura', '¿Cuál es la diferencia entre clímax y desenlace?', ['Son lo mismo', 'El clímax es el momento de mayor tensión; el desenlace resuelve la historia después', 'El desenlace va antes del clímax', 'El clímax presenta a los personajes'], 1, 'Primero el punto más alto (clímax) y luego la resolución (desenlace).');
Q('estructura', 'El tema de un relato es:', ['El resumen completo de lo que pasa', 'La idea central que el relato expresa sobre la vida', 'El lugar donde ocurre', 'El nombre del protagonista'], 1, 'El tema es la idea central, en pocas palabras.');
Q('estructura', 'Un cuento: una joven programadora pierde su empleo, aprende a vender sus apps por su cuenta y al final abre su propia empresa. ¿Cuál es el desenlace?', ['Pierde su empleo', 'Aprende a vender sus apps', 'Abre su propia empresa', 'Es programadora'], 2, 'El desenlace es la resolución final de la historia.');
Q('estructura', 'La estructura clásica también se resume en tres partes:', ['Introducción, desarrollo y conclusión', 'Planteamiento, nudo y desenlace', 'Verso, estrofa y rima', 'Acto, escena y cuadro'], 1, 'Planteamiento (inicio), nudo (conflicto) y desenlace. La otra es del ensayo.');

/* PERSONAJES, ESPACIO, TIEMPO */
Q('elementos', 'El personaje alrededor del cual gira la historia es el:', ['Incidental', 'Protagonista', 'Antagonista', 'Secundario'], 1, 'El protagonista es el personaje principal.');
Q('elementos', 'El personaje que se opone al protagonista es el:', ['Antagonista', 'Incidental', 'Secundario', 'Narrador'], 0, 'Antagonista = se opone.');
Q('elementos', 'Un personaje que aparece solo un momento y no influye en la historia es:', ['Protagonista', 'Redondo', 'Incidental', 'Antagonista'], 2, 'El incidental tiene muy poca participación.');
Q('elementos', '«Durante tres meses practicó la patada». Esta frase informa sobre el:', ['Espacio', 'Tiempo', 'Ambiente', 'Narrador'], 1, '«Durante tres meses» indica el tiempo.');
Q('elementos', '«En el tatami del deportivo de la colonia». Esta frase informa sobre el:', ['Tiempo', 'Clímax', 'Espacio', 'Tema'], 2, 'Indica dónde sucede: el espacio.');
Q('elementos', 'Un personaje que es complejo, tiene dudas y cambia a lo largo de la historia es:', ['Plano', 'Redondo', 'Incidental', 'Antagonista'], 1, 'Redondo = complejo y cambia. Plano = no cambia.');
Q('elementos', 'Un relato ocurre en una gran ciudad, entre edificios, tráfico y ruido. Su ambiente es:', ['Campirano', 'Marítimo', 'Urbano', 'Fantástico'], 2, 'Ciudad = ambiente urbano.');

/* LÍRICA */
Q('lirica', 'En un poema, la voz que expresa los sentimientos se llama:', ['Narrador', 'Hablante lírico', 'Personaje incidental', 'Acotación'], 1, 'El hablante lírico (yo poético) expresa sus sentimientos.');
Q('lirica', 'Cada una de las líneas de un poema se llama:', ['Estrofa', 'Párrafo', 'Verso', 'Escena'], 2, 'Verso = cada línea. Estrofa = grupo de versos.');
Q('lirica', 'Un poema de cuatro estrofas de cuatro versos cada una tiene:', ['Cuatro tercetos', 'Cuatro cuartetos (o redondillas)', 'Un soneto', 'Dieciséis estrofas'], 1, 'Estrofas de 4 versos: cuartetos (arte mayor) o redondillas (arte menor).');
Q('lirica', '¿Cuántas sílabas métricas tiene «La luna baja al camino»?', ['7', '8', '9', '10'], 1, 'La-lu-na-ba-jaal-ca-mi-no: 8 con la sinalefa «ja al». Palabra final llana: no cambia.');
Q('lirica', 'Unir en una sola sílaba la vocal final de una palabra con la vocal inicial de la siguiente se llama:', ['Rima', 'Sinalefa', 'Anáfora', 'Estrofa'], 1, 'La sinalefa une vocales entre palabras al contar sílabas.');
Q('lirica', 'Si un verso termina en palabra aguda (como «reloj»), al contar sus sílabas:', ['Se resta una', 'Se suma una', 'Se queda igual', 'Se duplica'], 1, 'Aguda aumenta (+1); esdrújula elimina (−1); llana igual.');
Q('lirica', 'Un verso de 11 sílabas es de:', ['Arte menor', 'Arte mayor', 'Verso libre', 'Rima asonante'], 1, 'Arte mayor = 9 sílabas o más. El de 11 es el endecasílabo.');
Q('lirica', 'El soneto tiene:', ['14 versos: dos cuartetos y dos tercetos', '8 versos: dos cuartetos', '10 versos libres', '16 versos en cuatro estrofas'], 0, 'Soneto = 4 + 4 + 3 + 3 = 14 versos, normalmente endecasílabos.');

/* RIMA */
Q('rima', '«corazón / canción». ¿Qué tipo de rima tienen?', ['Asonante', 'Consonante', 'Libre', 'Ninguna'], 1, '-ón / -ón: coinciden vocales y consonantes: consonante.');
Q('rima', '«tarde / madre». ¿Qué tipo de rima tienen?', ['Consonante', 'Asonante', 'En eco', 'Ninguna'], 1, 'Desde la vocal acentuada: -arde / -adre. Solo coinciden a-e: asonante.');
Q('rima', 'La rima en la que coinciden vocales y consonantes a partir de la última vocal acentuada se llama:', ['Asonante', 'Consonante', 'Libre', 'Blanca'], 1, 'Consonante = completa.');
Q('rima', 'La rima en la que solo coinciden las vocales a partir de la última vocal acentuada se llama:', ['Consonante', 'Asonante', 'Perfecta', 'Total'], 1, 'Asonante = así-así: solo vocales.');
Q('rima', 'Un poema sin rima y sin medida fija está escrito en:', ['Verso libre', 'Rima consonante', 'Redondillas', 'Sonetos'], 0, 'El verso libre no sigue rima ni medida.');
Q('rima', 'Versos que terminan en «flor (1) / día (2) / alegría (3) / dolor (4)». ¿Qué esquema tienen?', ['abab', 'aabb', 'abba', 'abcd'], 2, 'flor-dolor (1 y 4) = a; día-alegría (2 y 3) = b: abba.');
Q('rima', 'En el esquema de rima, las letras minúsculas (abba) indican que los versos son de:', ['Arte mayor', 'Arte menor', 'Verso libre', 'Prosa'], 1, 'Minúsculas = arte menor; mayúsculas (ABBA) = arte mayor.');

/* FIGURAS */
Q('figuras', '«Tus ojos son dos luceros». ¿Qué figura es?', ['Comparación', 'Metáfora', 'Onomatopeya', 'Anáfora'], 1, 'Identifica los ojos con luceros sin usar «como»: metáfora.');
Q('figuras', '«Corría como el viento». ¿Qué figura es?', ['Metáfora', 'Hipérbaton', 'Comparación', 'Antítesis'], 2, 'Usa el nexo «como»: comparación o símil.');
Q('figuras', '«Te esperé un millón de años». ¿Qué figura predomina?', ['Hipérbole', 'Prosopopeya', 'Sinestesia', 'Epíteto'], 0, 'Exagera el tiempo de espera: hipérbole.');
Q('figuras', '«La ciudad despierta y bosteza con sus mil ventanas». ¿Qué figura predomina?', ['Onomatopeya', 'Prosopopeya', 'Comparación', 'Anáfora'], 1, 'La ciudad hace acciones humanas (despertar, bostezar): prosopopeya.');
Q('figuras', '«Escuché el silencio amarillo de la tarde». ¿Qué figura hay?', ['Sinestesia', 'Anáfora', 'Hipérbaton', 'Comparación'], 0, 'Mezcla un sonido (silencio) con un color (amarillo): sinestesia.');
Q('figuras', '«El tic-tac del reloj no me dejaba dormir». ¿Qué figura hay?', ['Metáfora', 'Onomatopeya', 'Hipérbole', 'Antítesis'], 1, '«Tic-tac» imita un sonido: onomatopeya.');
Q('figuras', '«Ayer naciste y morirás mañana». ¿Qué figura predomina?', ['Antítesis', 'Onomatopeya', 'Comparación', 'Sinestesia'], 0, 'Junta ideas opuestas (nacer / morir): antítesis.');
Q('figuras', 'La figura que modifica las características sensoriales de las cosas (mezcla sentidos) es la:', ['Métrica', 'Sinestesia', 'Rima', 'Anáfora'], 1, 'Sinestesia = sentidos mezclados.');

/* DRAMÁTICO */
Q('dramatico', 'Las acotaciones de un texto dramático sirven para:', ['Contar la historia con un narrador', 'Orientar la puesta en escena: gestos, tono, espacio y movimientos', 'Hacer rimar los diálogos', 'Resumir la obra'], 1, 'Las acotaciones son indicaciones para representar la obra.');
Q('dramatico', '«(Una cocina humilde al amanecer. Suena la radio.)». Esta acotación inicial indica:', ['El estado de ánimo de un personaje', 'El espacio y el tiempo de la escena', 'El final de la obra', 'El tema'], 1, 'La primera acotación ubica la acción en un lugar y un momento.');
Q('dramatico', 'En el teatro, un personaje que habla solo para expresar en voz alta sus pensamientos íntimos hace un:', ['Diálogo', 'Aparte', 'Monólogo', 'Coro'], 2, 'Monólogo = un personaje habla solo.');
Q('dramatico', 'Las partes grandes en que se divide una obra de teatro se llaman:', ['Estrofas', 'Actos', 'Versos', 'Párrafos'], 1, 'La obra se divide en actos, y estos en escenas.');
Q('dramatico', 'La escena cambia, generalmente, cuando:', ['Entra o sale un personaje', 'Cambia la rima', 'Se acaba un párrafo', 'Habla el narrador'], 0, 'La entrada o salida de personajes marca una nueva escena.');
Q('dramatico', 'Subgénero dramático con un final fatal, en el que el protagonista no puede escapar de su destino:', ['Comedia', 'Farsa', 'Tragedia', 'Sainete'], 2, 'La tragedia termina en desgracia.');
Q('dramatico', 'Subgénero dramático que usa el humor y suele tener un final feliz:', ['Tragedia', 'Comedia', 'Monólogo', 'Ensayo'], 1, 'La comedia busca hacer reír.');
Q('dramatico', 'En una obra, Carla quiere irse a estudiar a otra ciudad, pero su padre necesita que atienda la tienda familiar. Eso es:', ['El conflicto', 'Una acotación', 'El desenlace', 'Un aparte'], 0, 'Conflicto = choque entre el deseo de Carla y lo que se le opone.');

/* ENSAYO */
Q('ensayo', 'La hipótesis o idea directriz de un ensayo es:', ['La postura que el autor defiende', 'Un resumen de la obra', 'El último párrafo', 'Un diálogo entre personajes'], 0, 'La hipótesis es la postura central que el autor va a sostener.');
Q('ensayo', 'En el ensayo, los argumentos se exponen en:', ['La introducción', 'El desarrollo', 'La conclusión', 'El título'], 1, 'El desarrollo sustenta la hipótesis con argumentos.');
Q('ensayo', '¿Qué conector introduce una conclusión?', ['Sin embargo', 'Por ejemplo', 'En suma', 'En primer lugar'], 2, '«En suma», «en conclusión» cierran el texto.');
Q('ensayo', '¿Qué conector expresa contraste u oposición?', ['Además', 'No obstante', 'En primer lugar', 'Por ejemplo'], 1, '«No obstante» = sin embargo: contraste.');
Q('ensayo', 'Hipótesis: «Las bibliotecas públicas siguen siendo necesarias en la era digital». ¿Qué argumento la refuerza?', ['Muchas personas no tienen internet en casa y usan la biblioteca para estudiar', 'Los libros impresos pesan mucho', 'Las bibliotecas cierran los domingos', 'Hay más videojuegos que libros'], 0, 'Apoya directamente que las bibliotecas siguen siendo necesarias.');
Q('ensayo', '¿Cuál es una característica del ensayo?', ['No tiene autor', 'Presenta la voz y la postura personal del autor', 'Se escribe en versos con rima', 'Siempre narra una historia de ficción'], 1, 'La voz autoral es esencial en el ensayo.');
Q('ensayo', 'La intención comunicativa del ensayo es:', ['Narrar hechos imaginarios', 'Expresar sentimientos en verso', 'Exponer y argumentar una postura para convencer', 'Dar indicaciones a los actores'], 2, 'El ensayo expone y argumenta una opinión.');
Q('ensayo', 'El último párrafo de un ensayo, que retoma la idea central y cierra el texto, es:', ['La hipótesis', 'Un argumento', 'La conclusión', 'La introducción'], 2, 'La conclusión cierra retomando la idea central.');

/* CONTEXTO / POR DENTRO Y POR FUERA */
Q('contexto', 'Estudiar la estructura y los componentes de una obra es hacer una lectura:', ['Extrínseca', 'Intrínseca', 'De recepción', 'Biográfica'], 1, 'INtrínseca = INterior, por dentro.');
Q('contexto', 'Estudiar la vida del autor y la época en que escribió es hacer una lectura:', ['Intrínseca', 'Extrínseca', 'Métrica', 'Retórica'], 1, 'EXtrínseca = EXterior, por fuera.');
Q('contexto', 'El contexto de producción incluye:', ['La edad y experiencia del lector', 'Las circunstancias históricas, sociales, culturales e ideológicas del autor al escribir', 'El número de versos', 'La rima del poema'], 1, 'Producción = circunstancias del autor y su época.');
Q('contexto', '«Sor Juana escribió en la Nueva España del siglo XVII, una sociedad que limitaba la educación de las mujeres». Este dato pertenece al:', ['Contexto de producción', 'Contexto de recepción', 'Tipo de narrador', 'Esquema de rima'], 0, 'Describe la época y la sociedad de la autora: contexto de producción.');
Q('contexto', 'Las ideas, creencias y postura del autor y de su época forman el contexto:', ['Geográfico', 'Ideológico', 'Métrico', 'De recepción'], 1, 'Ideológico = ideas y creencias.');
Q('contexto', 'Todo texto literario es producto de una sociedad y de su tiempo. Esto significa que:', ['Los textos no tienen relación con su época', 'El texto refleja el contexto histórico-social en que se escribió', 'Solo importa la opinión del lector', 'Los autores siempre escriben sobre el futuro'], 1, 'El texto lleva huellas de su contexto histórico-social.');
Q('contexto', 'Para lograr una interpretación global de una obra conviene:', ['Leer solo el resumen', 'Combinar la lectura intrínseca (por dentro) y la extrínseca (por fuera)', 'Ignorar la vida del autor', 'Contar solo los personajes'], 1, 'Las dos lecturas juntas dan la interpretación global.');

/* VISIÓN DEL MUNDO */
Q('vision', 'La forma de interpretar la realidad que se desprende de una obra es su:', ['Métrica', 'Visión del mundo', 'Ficha bibliográfica', 'Acotación'], 1, 'Visión del mundo = ideas, valores y creencias que el texto refleja o propone.');
Q('vision', '¿Cuál de estos es un tema universal de la literatura?', ['El precio del dólar', 'El amor', 'El horario del metro', 'La marca de un celular'], 1, 'El amor aparece en la literatura de todas las épocas.');
Q('vision', 'Un poema compara la juventud con la mañana y la vejez con la noche. ¿Qué tema universal trata?', ['La guerra', 'La vida y el paso del tiempo', 'La virtud', 'La política'], 1, 'Mañana → noche = juventud → vejez: la vida y su paso.');
Q('vision', 'Un cuento muestra a una familia que comparte lo poco que tiene con un vecino enfermo. ¿Qué visión del mundo propone?', ['La solidaridad como valor que nos une', 'El dinero es lo único importante', 'Cada quien debe salvarse solo', 'La enfermedad es un castigo'], 0, 'Los valores que se desprenden del texto: solidaridad.');
Q('vision', 'La intencionalidad del autor es:', ['El mensaje que transmite a través del texto', 'El número de páginas', 'La editorial del libro', 'El lugar donde vive el lector'], 0, 'Intención = el mensaje que el autor quiere comunicar.');
Q('vision', 'Un texto que denuncia con argumentos una injusticia social tiene la intención de:', ['Describir objetivamente una costumbre', 'Criticar y hacer reflexionar sobre la injusticia', 'Dar instrucciones', 'Narrar un cuento de hadas'], 1, 'Denunciar = criticar y provocar reflexión.');
Q('vision', 'El tema central de un texto es:', ['Su idea principal, en pocas palabras', 'La biografía del autor', 'La cantidad de estrofas', 'La opinión del lector'], 0, 'El tema es la idea principal.');

/* CORRIENTES */
Q('corrientes', '¿Qué corriente se ubica aproximadamente entre 1600 y 1700?', ['Renacimiento', 'Barroco', 'Romanticismo', 'Neoclasicismo'], 1, 'Apéndice 5: Barroco, 1600 a 1700 (aprox.).');
Q('corrientes', 'Víctor Hugo, Lord Byron y Hölderlin son autores representativos del:', ['Barroco', 'Neoclasicismo', 'Romanticismo', 'Vanguardismo'], 2, 'Apéndice 5: Romanticismo, 1800 a 1860 (aprox.).');
Q('corrientes', 'Según el Apéndice 5, ¿qué corriente se ubica entre 1900 y 1930, con autores como Rilke y Marinetti?', ['Vanguardismo', 'Realismo y costumbrismo', 'Barroco', 'Renacimiento'], 0, 'Vanguardismo: 1900 a 1930.');
Q('corrientes', 'Según el Apéndice 5, el Realismo y costumbrismo se ubica entre:', ['1500 y 1600', '1600 y 1700', '1860 y 1900', '1900 y 1930'], 2, 'Realismo y costumbrismo: 1860 a 1900 (Pérez Galdós, Balzac, Dickens).');
Q('corrientes', 'Ordena cronológicamente: I. Romanticismo · II. Barroco · III. Vanguardias · IV. Neoclasicismo', ['II, IV, I y III', 'IV, II, I y III', 'II, I, IV y III', 'I, II, IV y III'], 0, 'Barroco (1600) → Neoclasicismo (1700) → Romanticismo (1800) → Vanguardias (1910).', { f: 'ordenar' });
Q('corrientes', 'Voltaire, Montesquieu, Félix María Samaniego y Leandro Fernández de Moratín son autores del:', ['Neoclasicismo', 'Romanticismo', 'Renacimiento', 'Vanguardismo'], 0, 'Apéndice 5: Neoclasicismo, 1700 a 1800 (aprox.).');
Q('corrientes', 'Los movimientos de principios del siglo XX que buscaron innovar y romper con todas las formas anteriores (futurismo, dadaísmo, surrealismo) son las:', ['Vanguardias', 'Barroco', 'Renacimiento', 'Edad Media'], 0, 'Las vanguardias surgieron en Europa a principios del siglo XX.');

/* RESEÑA */
Q('resena', '¿Qué parte de la reseña resume los acontecimientos, personajes y temas de la obra?', ['Comentario', 'Sinopsis', 'Ficha bibliográfica', 'Conclusión'], 1, 'La sinopsis es el resumen de la trama.');
Q('resena', '¿Qué parte de la reseña contiene la opinión o valoración del reseñista?', ['Ficha bibliográfica', 'Datos del autor', 'Comentario', 'Sinopsis'], 2, 'El comentario es la valoración con razones.');
Q('resena', '¿Cuál es la ficha bibliográfica bien escrita?', ['Pedro Páramo, Rulfo, 1955', 'Rulfo, J. (1955). Pedro Páramo. México: Fondo de Cultura Económica.', 'Fondo de Cultura Económica: Rulfo (Pedro Páramo)', '1955. México. Rulfo. Pedro Páramo'], 1, 'Apellido, inicial (año). Título. Ciudad: Editorial.');
Q('resena', 'Ordena las partes de una reseña: I. Sinopsis · II. Ficha bibliográfica · III. Comentario · IV. Datos del autor', ['II, IV, I y III', 'I, II, III y IV', 'IV, II, I y III', 'II, I, IV y III'], 0, 'Ficha, autor, sinopsis y comentario.', { f: 'ordenar' });
Q('resena', 'Según el libro, ¿cuántos elementos contiene una reseña?', ['Dos: sinopsis y comentario', 'Cuatro: referencia bibliográfica, datos biográficos del autor, sinopsis y comentario', 'Tres: introducción, desarrollo y conclusión', 'Cinco: acto, escena, diálogo, monólogo y acotación'], 1, 'Aunque varíe el orden, la reseña tiene esos cuatro elementos.');
Q('resena', 'El propósito principal de una reseña es:', ['Sustituir la lectura de la obra', 'Dejar saber a quien la lee si vale la pena la lectura de una obra', 'Escribir un poema sobre un libro', 'Representar la obra en un teatro'], 1, 'Así lo define el libro; la opinión se justifica con hechos de la obra.');

Q('estrategias', '¿Cuál de estas expresiones es un dato y NO una valoración?', ['«Me encantó el final»', '«La novela se publicó en 1955»', '«Es una lectura necesaria»', '«Recomiendo leerla»'], 1, 'La fecha de publicación se puede comprobar: es un dato.');

Q('elementos', '«Un calor sofocante, como si el aire estuviera estancado y podrido» describe un espacio:', ['Físico', 'Psicológico', 'Geográfico', 'Externo'], 1, 'El espacio psicológico es el ambiente que se percibe e intensifica las emociones.');
Q('estrategias', 'Según el libro, ¿con qué recursos se puede introducir el tema de una reseña?', ['Con una anécdota, un dato impresionante, una escena de peligro o un caso real', 'Con acotaciones entre paréntesis', 'Con versos de arte mayor', 'Con la ficha bibliográfica únicamente'], 0, 'Es la estrategia «cómo se introduce el tema».');

const PASSAGES = {
  p1: { title: 'El último round', kind: 'narr', text: 'Faltaban diez segundos y el marcador estaba empatado. Yo sentía las piernas pesadas, como si alguien me hubiera amarrado costales de arena a los tobillos. Mi entrenador gritaba algo desde la esquina del tatami, en el deportivo de mi colonia, pero yo solo escuchaba mi respiración.\nDurante tres meses había practicado una patada giratoria que nunca me salía en los entrenamientos. Esa tarde, frente a mi rival, decidí intentarla. Giré, levanté la pierna y, por primera vez, la patada llegó limpia al peto.\nSonó la campana. Había ganado por un punto. Cuando el juez levantó mi brazo, entendí que la medalla era lo de menos: lo importante era que había dejado de tenerle miedo a fallar.', src: 'Texto original elaborado para esta plataforma.' },
  p2: { title: 'La app de doña Chayo', kind: 'narr', text: 'Doña Chayo vendía tamales en la esquina del mercado desde hacía treinta años y anotaba los pedidos en una libreta con las hojas dobladas. Un lunes, la libreta se le cayó en un charco y la tinta se corrió: perdió todos los encargos de la semana. Esa noche no pudo dormir; pensaba que sus clientes ya no confiarían en ella.\nSu nieto Iván, que estudiaba programación, la vio tan preocupada que pasó la madrugada frente a la computadora. No le dijo nada, pero por dentro temía que su abuela no quisiera usar el teléfono.\nAl día siguiente le mostró una aplicación sencilla, con botones grandes y dibujos de tamales verdes, rojos y de dulce. Doña Chayo frunció el ceño, apretó un botón y escuchó un timbre alegre. Sonrió. Desde entonces, en el mercado dicen que es la tamalera más moderna de la ciudad.', src: 'Texto original elaborado para esta plataforma.' },
  p3: { title: 'Lo que el viento sabe', kind: 'lir', verse: true, text: 'El viento cruza la sierra\ncomo un río sin orillas,\nlleva canciones antiguas\ny memorias de las niñas.\n\nMi casa es una guitarra\nque suena si no hay nadie,\ny el silencio, como un perro,\nse duerme junto a mi madre.\n\nPregunto por los que fueron,\npregunto por los que parten,\npregunto, y solo responde\nel viento con mil mitades.', src: 'Poema original elaborado para esta plataforma.' },
  p4: { title: 'Rima XXI (Gustavo Adolfo Bécquer)', kind: 'lir', verse: true, text: '¿Qué es poesía?, dices mientras clavas\nen mi pupila tu pupila azul.\n¿Qué es poesía? ¿Y tú me lo preguntas?\nPoesía… eres tú.', src: 'Gustavo Adolfo Bécquer (España, 1836-1870), Rimas. Dominio público.' },
  p5: { title: 'Código rojo (escena única)', kind: 'dram', text: '(Un cuarto pequeño. Un escritorio con una computadora encendida. Es de madrugada. TOMÁS, de diecinueve años, teclea rápido. Entra su hermana ELENA, en pijama.)\nELENA: (bostezando) ¿Otra vez despierto? Son las tres de la mañana.\nTOMÁS: (sin voltear) Mañana entrego el proyecto y el programa no corre.\nELENA: (se acerca y mira la pantalla) Te falta cerrar una llave en la línea cuarenta.\nELENA: (le pone una mano en el hombro) Duérmete. Los errores se ven mejor con los ojos descansados. (Sale.)\nTOMÁS: (solo, mirando la puerta) Siempre ella. Nunca estudió programación y encuentra mis errores en un segundo. ¿Y yo? Tres semanas frente a esta pantalla… (Sonríe.) Mañana le invito un café.\n(TOMÁS apaga el monitor. Oscuro.)', src: 'Texto original elaborado para esta plataforma.' },
  p6: { title: '¿Aprender a programar es aprender otro idioma?', kind: 'ens', text: 'Suele decirse que programar es cosa de genios de las matemáticas. Sostengo, por el contrario, que programar se parece más a aprender un idioma que a resolver ecuaciones difíciles, y que cualquier persona constante puede lograrlo.\nEn primer lugar, un lenguaje de programación tiene vocabulario y reglas, igual que el español: si cambias el orden de las palabras, el mensaje deja de entenderse.\nAdemás, como ocurre con cualquier idioma, se aprende practicando un poco cada día y equivocándose sin miedo; nadie aprende a hablar otra lengua leyendo un solo libro.\nPor último, miles de programadores comenzaron sin ser los mejores de su clase en matemáticas, pero no se rindieron ante el primer error.\nEn conclusión, programar no exige un talento especial, sino paciencia y práctica. Quizá el verdadero lenguaje que hay que aprender es el de la constancia.', src: 'Texto original elaborado para esta plataforma.' },
  p7: { title: 'Reseña de «Frankenstein»', kind: 'res', text: 'Shelley, M. (1818). Frankenstein o el moderno Prometeo. Londres: Lackington.\nMary Shelley nació en Londres en 1797 y murió en 1851. Comenzó a escribir esta novela con apenas dieciocho años, durante un verano lluvioso en Suiza en el que sus amigos se retaron a escribir historias de terror.\nVíctor Frankenstein, un joven científico, logra dar vida a un ser formado con partes de cadáveres. Horrorizado por su apariencia, lo abandona. La criatura, que al principio solo busca afecto, es rechazada por todos y decide vengarse de su creador.\nPara mí, es mucho más que una historia de miedo: es una pregunta incómoda sobre la responsabilidad de quien crea algo. ¿Qué haríamos hoy con una inteligencia artificial que nadie quiere cuidar? Recomiendo leerla con calma: cada capítulo deja una reflexión que todavía nos toca.', src: 'Reseña original elaborada para esta plataforma.' },
  p8: { title: 'En paz (fragmento, Amado Nervo)', kind: 'ctx', verse: true, text: 'Muy cerca de mi ocaso, yo te bendigo, Vida,\nporque nunca me diste ni esperanza fallida,\nni trabajos injustos, ni pena inmerecida;', src: 'Amado Nervo (México, 1870-1919). Dominio público.' },
  p9: { title: 'Un lector de hoy', kind: 'rec', text: 'Diego, de veinte años, entrena taekwondo por las tardes y estudia la prepa en línea. En su celular lee «En paz», un poema que Amado Nervo escribió a principios del siglo XX, cuando ya era un hombre maduro que sentía cerca el final de su vida. Al principio, Diego piensa que el poema no tiene nada que ver con él, porque apenas empieza a vivir. Luego recuerda a su abuelo, que siempre dice que la vida le dio más de lo que pidió, y decide escribir un ensayo sobre el agradecimiento en distintas etapas de la vida.', src: 'Texto original elaborado para esta plataforma.' }
};

  /* ═════════ QUIZ / SIMULADORES ═════════ */
  function pool(t) { return BANK.filter(q => q.t === t && !q.eva && !q.p); }
  function pickFrom(t, n, used) { const p = shuffle(pool(t).filter(q => !used.has(q.id))).slice(0, n); p.forEach(q => used.add(q.id)); return p; }
  function makeItems(list) { return list.map(q => ({ id: q.id, order: shuffle(q.o.map((_, i) => i)) })); }
  function startQuiz(cfg) {

  const QUIZ = {
    mini(t) { const used = new Set(); const items = pickFrom(t, 5, used); startQuiz({ type: 'mini', mode: 'learn', title: 'Mini cuestionario: ' + TITLE(t), items: makeItems(items), topic: t }); },
    world(w) { const used = new Set(); let items = []; LESSONS.filter(l => l.world === w).forEach(l => { items = items.concat(pickFrom(l.id, 3, used)); }); startQuiz({ type: 'mini', mode: 'learn', title: 'Mini quiz · Mundo ' + w, items: makeItems(shuffle(items)) }); },
    parcial(u) {
      const used = new Set(); let pas = [];
      if (u === 1) { pas = passagePick(['p1', 'p2'], 3, used).concat(passagePick(['p3', 'p5', 'p6'], 2, used)); }
      else if (u === 2) { pas = passagePick(['p7', 'p4', 'p8'], 3, used); }
      else { pas = passagePick(['p9'], 3, used); }
      const ls = LESSONS.filter(l => l.unit === u && l.id !== 'leer-examen');

    const g = ORDER_GAMES.find(x => x.id === ORD.id);

    <div class="order-list">${ORD.cur.map((it, k) => `<div class="order-item ${ORD.checked ? (it === g.items[k] ? 'good' : 'badp') : ''}"><span class="on">${k + 1}</span><span>${esc(it)}</span><span class="mv"><button data-a="ordMv" data-k="${k}" data-d="-1" aria-label="Subir">↑</button><button data-a="ordMv" data-k="${k}" data-d="1" aria-label="Bajar">↓</button></span></div>`).join('')}</div>
    <button class="btn wide" data-a="ordCheck">Comprobar</button>
    ${ORD.checked ? (ORD.cur.every((it, k) => it === g.items[k]) ? '<div class="fb ok"><b class="h">¡Perfecto! +20 XP</b></div>' : '<div class="fb no"><b class="h">Algunos están en otro lugar</b><span>Los rojos no están en su posición. Muévelos y comprueba otra vez.</span></div>') : ''}`;
  }
  /* Parejas */
  let MAT = null;
  function vMatch() {
    if (!MAT) return `<button class="back" data-a="go" data-v="review">← Repaso</button><h1>Parejas</h1><p class="muted">Toca un concepto y luego su pareja.</p><div class="stack">${MATCH_GAMES.map(g => `<button class="mission-l" data-a="matStart" data-id="${g.id}"><span class="chip ${S.games[g.id] ? 'done' : 'fmt'}">${S.games[g.id] ? 'Hecho' : g.pairs.length}</span><span class="t">${esc(g.title)}</span><span aria-hidden="true">→</span></button>`).join('')}</div>`;

    return `<button class="back" data-a="matBack">← Parejas</button><h1>${esc(g.title)}</h1>
    <div class="match-grid"><div class="stack" style="gap:8px">${MAT.L.map(i => `<button class="${MAT.done[i] ? 'done' : MAT.selL === i ? 'sel' : ''}" data-a="matL" data-i="${i}" ${MAT.done[i] ? 'disabled' : ''}>${esc(g.pairs[i][0])}</button>`).join('')}</div>
    <div class="stack" style="gap:8px">${MAT.R.map(i => `<button class="${MAT.done[i] ? 'done' : MAT.err === i ? 'err' : ''}" data-a="matR" data-i="${i}" ${MAT.done[i] ? 'disabled' : ''}>${esc(g.pairs[i][1])}</button>`).join('')}</div></div>
    ${all ? '<div class="fb ok confetti"><b class="h">¡Completaste todas las parejas! +20 XP</b></div><button class="btn" data-a="matBack">Otro reto</button>' : ''}`;

  /* Conceptos clave */
  function vKeys() {
    return `<button class="back" data-a="go" data-v="review">← Repaso</button><div class="stack"><div class="eyebrow">Resumen visual</div><h1>Conceptos clave</h1><p class="muted">Ideal para la mañana del examen: los trucos y trampas de cada tema.</p></div>
    ${WORLDS.map(w => `<details class="card" ${w.id === 1 ? 'open' : ''}><summary><b>Mundo ${w.id} · ${esc(w.name)}</b></summary><div class="stack" style="margin-top:10px">${LESSONS.filter(l => l.world === w.id).map(l => `<div class="stack" style="gap:6px;border-top:1px solid var(--line);padding-top:10px"><div class="spread"><h3>${esc(l.title)}</h3><span class="chip ${l.prio}">${l.prio}</span></div><p>${l.trick}</p><ul style="margin:0;padding-left:18px;font-size:.92rem;color:var(--muted)">${l.trap.map(t => `<li>${t}</li>`).join('')}</ul></div>`).join('')}</div></details>`).join('')}`;
  }
  /* Glosario */
  function glossList(q) {

    return GLOSSARY.filter(g => !s || norm(g[0]).includes(s) || norm(g[1]).includes(s) || norm(g[2]).includes(s)).map(g => `<div class="gloss-row"><span class="es">${esc(g[0])}</span><span class="en">${esc(g[1])}</span><span class="muted">${esc(g[2])}</span></div>`).join('') || '<p class="muted">No encontré esa palabra. Pregúntale a tu asesora.</p>';
  }
  function vGloss() {
    return `<button class="back" data-a="go" data-v="review">← Repaso</button><div class="stack"><div class="eyebrow">Glosario</div><h1>Palabras del Módulo 7</h1><p class="muted">Cada término trae un ejemplo (en azul) y su significado.</p></div>
    <input class="search" id="glossQ" type="search" placeholder="Ej. acotación, metáfora…" aria-label="Buscar palabra" autocomplete="off">
    <div class="card" id="glossList">${glossList('')}</div>`;
  }

  /* ═════════ VISTA: EXAMEN ═════════ */
  const CHECKS = ['Comprobante de examen impreso (cuando lo tengas)', 'Identificación oficial', 'Lápiz del número 2 o 2½, goma y sacapuntas', 'Saber cómo llegar a la sede (revisarlo un día antes)', 'Llegar 15 minutos antes', 'Dormir bien la noche anterior (y no entrenar pesado ese día)'];
  function vExam() {
    const dl = daysLeft(); const e = examInfo();
    return `
    <div class="stack"><div class="eyebrow">Día del examen</div><h1>${e.set ? esc(fmtLong(examDate()).replace(/^./, c => c.toUpperCase())) : 'Fecha por confirmar'}</h1>${e.set ? '' : '<p class="muted">Todavía no tienes comprobante. Cuando lo tengas, anota aquí la fecha real y tu plan se ajusta solo.</p>'}</div>
    <section class="ticket" aria-label="Datos del examen"><div class="ticket-h"><span>Examen · Plan modular</span><span class="tnum">${!e.set ? '' : dl > 0 ? `Faltan ${dl} días` : dl === 0 ? 'Es hoy' : 'Ya pasó'}</span></div>
      <div class="ticket-b"><dl class="kv">
        <dt>Asignatura</dt><dd>07 · Textos y visiones del mundo</dd>
        <dt>Día y hora</dt><dd>${e.set ? esc(examWhen()) : '<span class="muted">Por confirmar</span>'}</dd>
        <dt>Llegar a las</dt><dd>15 minutos antes</dd>
        <dt>Sede</dt><dd>${e.sede ? esc(e.sede) : '<span class="muted">Por confirmar</span>'}</dd>
        <dt>Llevar</dt><dd>Comprobante, identificación y lápiz</dd>
        <dt>Formato</dt><dd>Opción múltiple con textos para leer; calificación = aciertos ÷ 4 si son 40 preguntas</dd>
      </dl>
      <details class="card flat"><summary><b>Cambiar fecha, hora o sede</b></summary><div class="exam-form" style="margin-top:10px">
        <label for="exDate">Fecha del examen</label><input class="search" id="exDate" type="date" data-a2="exam" value="${e.set ? esc(e.date) : ''}">
        <label for="exTime">Hora</label><input class="search" id="exTime" type="time" data-a2="exam" value="${esc(e.time)}">
        <label for="exSede">Sede</label><input class="search" id="exSede" type="text" data-a2="exam" value="${esc(e.sede)}" placeholder="Nombre y dirección de la sede">
        <button class="btn small line" data-a="replan">Volver a armar mi plan desde hoy</button>
